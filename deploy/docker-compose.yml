# Sistema do LinkedIn (app + banco) e a Central de clientes (backoffice). O Caddy do servidor publica com HTTPS:
#   app        -> 127.0.0.1:3100  (domínio do sistema)
#   backoffice -> 127.0.0.1:3300  (domínio próprio, separado do sistema)
name: linkedin-auto
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?preencha DB_PASSWORD no .env}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 20
    mem_limit: 512m
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@db:5432/app
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
  backoffice:
    build:
      context: ../backoffice
      dockerfile: ../deploy/backoffice.Dockerfile
    restart: unless-stopped
    environment:
      # Banco PRÓPRIO do backoffice (administradores e registro de ações), no mesmo servidor de banco, separado do banco do sistema.
      BACKOFFICE_DATABASE_URL: postgresql://app:${DB_PASSWORD}@db:5432/backoffice
      BACKOFFICE_SECRET: ${BACKOFFICE_SECRET:?preencha BACKOFFICE_SECRET no .env}
      BACKOFFICE_SETUP_KEY: ${BACKOFFICE_SETUP_KEY:?preencha BACKOFFICE_SETUP_KEY no .env}
      BACKOFFICE_URL: ${BACKOFFICE_URL:?preencha BACKOFFICE_URL no .env}
      SISTEMA_URL: http://app:3000
      OPS_SECRET: ${OPS_SECRET:?preencha OPS_SECRET no .env}
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      app:
        condition: service_started
    mem_limit: 384m
volumes:
  pgdata:
